[project]
name = "ytbot-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "langchain-openai>=0.3.28",
    "langgraph>=0.6.6",
    "langgraph-checkpoint-postgres>=2.1.1",
    "openai>=3.49.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "youtube-transcript-api>=1.2.5",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "network: requires internet access (opt in with RUN_NETWORK_TESTS=1)",
    "openai: requires OPENAI_API_KEY",
]
